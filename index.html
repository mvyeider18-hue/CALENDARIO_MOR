<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario MOR ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #ff6b81;
      --secondary: #ff4757;
      --bg: #fff5f6;
      --card-bg: #ffffff;
      --text: #2f3542;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 15px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(255, 107, 129, 0.15);
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 3rem;
      color: var(--secondary);
      margin: 0;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .month-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.3s;
    }

    .month-btn:hover {
      background: var(--secondary);
    }

    #monthYearTitle {
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--secondary);
    }

    /* Cuadrícula del Calendario */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }

    .day-header {
      text-align: center;
      font-weight: 600;
      color: #a4b0be;
      padding: 8px 0;
      font-size: 0.9rem;
    }

    .day-cell {
      background: #f1f2f6;
      border-radius: 12px;
      min-height: 85px;
      padding: 6px;
      position: relative;
      cursor: pointer;
      transition: 0.2s;
    }

    .day-cell:hover {
      background: #ffeaa7;
    }

    .day-cell.other-month {
      opacity: 0.3;
    }

    .day-number {
      font-weight: 600;
      font-size: 0.85rem;
      color: #57606f;
    }

    .day-cell.today {
      border: 2px solid var(--primary);
      background: #fff0f2;
    }

    .events-container {
      margin-top: 4px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .event-badge {
      font-size: 0.72rem;
      padding: 2px 5px;
      border-radius: 6px;
      color: white;
      background: var(--primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Modal / Popup */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 16px;
      width: 90%;
      max-width: 400px;
    }

    .modal-content h3 {
      margin-top: 0;
      color: var(--secondary);
    }

    .modal-content input, .modal-content select {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ddd;
      box-sizing: border-box;
    }

    .modal-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 15px;
    }

    .btn-save { background: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; }
    .btn-cancel { background: #ccc; color: #333; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; }
    
    .event-list-modal {
      list-style: none;
      padding: 0;
      max-height: 150px;
      overflow-y: auto;
      margin-bottom: 15px;
    }

    .event-item-modal {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px;
      background: #f8f9fa;
      border-radius: 6px;
      margin-bottom: 5px;
      font-size: 0.85rem;
    }

    .delete-btn {
      background: #ff4757;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 2px 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Calendario MOR ❤️</h1>
    </header>

    <div class="controls">
      <button class="month-btn" onclick="changeMonth(-1)">❮ Anterior</button>
      <div id="monthYearTitle"></div>
      <button class="month-btn" onclick="changeMonth(1)">Siguiente ❯</button>
    </div>

    <div class="calendar-grid" id="calendarHeader">
      <div class="day-header">Dom</div>
      <div class="day-header">Lun</div>
      <div class="day-header">Mar</div>
      <div class="day-header">Mié</div>
      <div class="day-header">Jue</div>
      <div class="day-header">Vie</div>
      <div class="day-header">Sáb</div>
    </div>

    <div class="calendar-grid" id="calendarBody"></div>
  </div>

  <!-- Modal para ver/agregar eventos -->
  <div class="modal" id="eventModal">
    <div class="modal-content">
      <h3 id="modalDateTitle">Eventos</h3>
      
      <ul class="event-list-modal" id="modalEventsList"></ul>

      <h4>Agregar Evento:</h4>
      <input type="text" id="eventInput" placeholder="Ej: Cita especial, Aniversario...">
      <select id="eventCategory">
        <option value="#ff6b81">❤️ Especial / Cita</option>
        <option value="#70a1ff">✈️ Viaje / Salida</option>
        <option value="#2ed573">🎉 Celebración</option>
        <option value="#ffa502">📌 Recordatorio</option>
      </select>

      <div class="modal-buttons">
        <button class="btn-cancel" onclick="closeModal()">Cerrar</button>
        <button class="btn-save" onclick="saveEvent()">Guardar</button>
      </div>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD3DxpUgdxQZ5f5VOBO_NHfhyLnn-IwWbo",
      authDomain: "calendario-875fd.firebaseapp.com",
      databaseURL: "https://calendario-875fd-default-rtdb.firebaseio.com",
      projectId: "calendario-875fd",
      storageBucket: "calendario-875fd.firebasestorage.app",
      messagingSenderId: "2826490976",
      appId: "1:2826490976:web:04cc1fb6e4a6a4f36c5f05",
      measurementId: "G-THY554NC9Z"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const eventsRef = database.ref('eventos');

    let currentDate = new Date();
    let selectedDateStr = "";
    let allEvents = {};

    const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

    eventsRef.on('value', (snapshot) => {
      allEvents = snapshot.val() || {};
      renderCalendar();
      if (selectedDateStr) updateModalEvents();
    });

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      document.getElementById('monthYearTitle').innerText = `${monthNames[month]} ${year}`;

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const daysInPrevMonth = new Date(year, month, 0).getDate();

      const calendarBody = document.getElementById('calendarBody');
      calendarBody.innerHTML = '';

      // Días del mes anterior
      for (let i = firstDay - 1; i >= 0; i--) {
        const dayCell = document.createElement('div');
        dayCell.className = 'day-cell other-month';
        dayCell.innerHTML = `<span class="day-number">${daysInPrevMonth - i}</span>`;
        calendarBody.appendChild(dayCell);
      }

      // Días del mes actual
      const today = new Date();
      for (let day = 1; day <= daysInMonth; day++) {
        const dayCell = document.createElement('div');
        dayCell.className = 'day-cell';
        
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        
        if (day === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
          dayCell.classList.add('today');
        }

        dayCell.innerHTML = `<span class="day-number">${day}</span>`;

        // Renderizar eventos del día
        const eventsContainer = document.createElement('div');
        eventsContainer.className = 'events-container';

        Object.keys(allEvents).forEach(key => {
          if (allEvents[key].date === dateStr) {
            const badge = document.createElement('div');
            badge.className = 'event-badge';
            badge.style.backgroundColor = allEvents[key].color || '#ff6b81';
            badge.innerText = allEvents[key].title;
            eventsContainer.appendChild(badge);
          }
        });

        dayCell.appendChild(eventsContainer);
        dayCell.onclick = () => openModal(dateStr);
        calendarBody.appendChild(dayCell);
      }
    }

    function changeMonth(direction) {
      currentDate.setMonth(currentDate.getMonth() + direction);
      renderCalendar();
    }

    function openModal(dateStr) {
      selectedDateStr = dateStr;
      document.getElementById('modalDateTitle').innerText = `Día: ${dateStr}`;
      document.getElementById('eventInput').value = '';
      updateModalEvents();
      document.getElementById('eventModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('eventModal').style.display = 'none';
      selectedDateStr = "";
    }

    function updateModalEvents() {
      const list = document.getElementById('modalEventsList');
      list.innerHTML = '';
      let hasEvents = false;

      Object.keys(allEvents).forEach(key => {
        if (allEvents[key].date === selectedDateStr) {
          hasEvents = true;
          const li = document.createElement('li');
          li.className = 'event-item-modal';
          li.innerHTML = `
            <span>${allEvents[key].title}</span>
            <button class="delete-btn" onclick="deleteEvent('${key}')">✕</button>
          `;
          list.appendChild(li);
        }
      });

      if (!hasEvents) {
        list.innerHTML = '<li style="color:#aaa; text-align:center;">No hay eventos en esta fecha.</li>';
      }
    }

    function saveEvent() {
      const title = document.getElementById('eventInput').value.trim();
      const color = document.getElementById('eventCategory').value;

      if (!title) return alert('Escribe algo para el evento.');

      eventsRef.push({
        date: selectedDateStr,
        title: title,
        color: color
      });

      document.getElementById('eventInput').value = '';
    }

    function deleteEvent(key) {
      eventsRef.child(key).remove();
    }
  </script>
</body>
</html>
