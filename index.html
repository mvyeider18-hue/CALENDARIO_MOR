<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario YEIDER & NATALY ❤️</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="https://i.imgur.com/SPBevo4.png">
  <link rel="apple-touch-icon" href="https://i.imgur.com/SPBevo4.png">
  <!-- Tipografía Montserrat ExtraLight (pesos 200, 300, 400) -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --fondo-body: #f5efe6;
      --card-bg: #faf6f0;
      --beige-mediano: #d8c8b8;
      --cafe-suave: #8c6d58;
      --cafe-tierra: #6f4e37;
      --cafe-oscuro: #3e2723;
      --blanco: #ffffff;
      --gold-hoy: #d4af37;
      --aniversario: #b85b56;
      --morado-clase: #7b5260;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Montserrat', sans-serif;
      font-weight: 200;
      background-color: var(--fondo-body);
      color: var(--cafe-oscuro);
      margin: 0;
      padding: 8px;
      position: relative;
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }

    /* Imagen de fondo romántica visible e inmóvil al deslizar */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: url('https://i.imgur.com/SPBevo4.png');
      background-repeat: no-repeat;
      background-position: center;
      background-size: min(340px, 82vw);
      opacity: 0.16;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: rgba(250, 246, 240, 0.93);
      backdrop-filter: blur(8px);
      border-radius: 24px;
      padding: 14px;
      box-shadow: 0 12px 32px rgba(62, 39, 35, 0.12);
      position: relative;
      z-index: 1;
      overflow-x: auto;
      border: 1px solid var(--beige-mediano);
    }

    header {
      text-align: center;
      border-bottom: 1px solid var(--beige-mediano);
      padding-bottom: 12px;
      margin-bottom: 12px;
    }

    header h1 {
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
      font-size: 1.8rem;
      letter-spacing: -0.3px;
      color: var(--cafe-tierra);
      margin: 0;
      text-transform: uppercase;
    }

    .time-zones {
      display: flex;
      justify-content: center;
      gap: 8px;
      font-size: 0.8rem;
      font-weight: 300;
      color: var(--cafe-tierra);
      margin-top: 8px;
      flex-wrap: wrap;
    }
    
    .time-badge {
      background: var(--blanco);
      padding: 5px 12px;
      border-radius: 18px;
      border: 1px solid var(--beige-mediano);
      color: var(--cafe-oscuro);
      box-shadow: 0 2px 5px rgba(0,0,0,0.03);
    }

    .view-selector {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .btn-view {
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
      background: var(--blanco);
      border: 1px solid var(--beige-mediano);
      color: var(--cafe-oscuro);
      padding: 7px 13px;
      border-radius: 18px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-view.active, .btn-view:hover {
      background: var(--cafe-tierra);
      color: var(--blanco);
      border-color: var(--cafe-tierra);
    }

    .nav-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .btn-action {
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
      background: var(--cafe-tierra);
      color: var(--blanco);
      border: none;
      padding: 8px 15px;
      border-radius: 20px;
      font-size: 0.82rem;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(111, 78, 55, 0.25);
      transition: all 0.2s ease;
    }

    .btn-action:hover {
      background: var(--cafe-oscuro);
    }

    #periodTitle {
      font-size: 0.95rem;
      font-weight: 400;
      color: var(--cafe-oscuro);
      text-align: center;
    }

    /* GRID MES COMPLETO (7 columnas) */
    .month-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(44px, 1fr));
      gap: 5px;
      width: 100%;
    }

    /* GRID SEMANAL REDISEÑADO A 3 FILAS */
    .week-container-3rows {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .week-row {
      display: grid;
      gap: 8px;
    }

    .week-row.row-2 {
      grid-template-columns: repeat(2, 1fr);
    }

    .week-row.row-3 {
      grid-template-columns: repeat(3, 1fr);
    }

    .grid-header-day {
      text-align: center;
      font-weight: 400;
      font-size: 0.75rem;
      color: var(--cafe-suave);
      padding: 4px 0;
    }

    .calendar-cell {
      background: var(--blanco);
      border: 1px solid var(--beige-mediano);
      border-radius: 14px;
      min-height: 125px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.1s;
      color: var(--cafe-oscuro);
      position: relative;
    }

    .calendar-cell:hover {
      border-color: var(--cafe-tierra);
      transform: translateY(-2px);
    }

    /* Resaltado del día actual (HOY) */
    .calendar-cell.is-today {
      border: 2px solid var(--gold-hoy) !important;
      background: #fffdf8 !important;
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
    }

    .calendar-cell.is-today::after {
      content: "HOY";
      position: absolute;
      top: -7px;
      right: 6px;
      background: var(--gold-hoy);
      color: #fff;
      font-size: 0.55rem;
      font-weight: 500;
      padding: 1px 5px;
      border-radius: 6px;
    }

    .calendar-cell.other-month {
      background: rgba(255, 255, 255, 0.4);
      opacity: 0.45;
    }

    .cell-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      font-weight: 400;
    }

    .calendar-cell.anniversary {
      border: 1.5px solid var(--aniversario);
      background: #fff8f7;
    }

    .shift-mini-tag {
      font-size: 0.65rem;
      padding: 3px 6px;
      border-radius: 6px;
      font-weight: 300;
      margin-top: 4px;
      text-align: center;
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .class-mini-tag {
      font-size: 0.62rem;
      padding: 3px 6px;
      border-radius: 6px;
      font-weight: 300;
      margin-top: 3px;
      text-align: center;
      display: block;
      background: var(--morado-clase);
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .shift-day { background: #e6c896; color: var(--cafe-oscuro); }
    .shift-night { background: var(--cafe-oscuro); color: #ffffff; }
    .shift-rest { background: #8fa382; color: #ffffff; }

    .plan-dots {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin-top: 5px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }

    .dot.yeider { background-color: var(--cafe-oscuro); }
    .dot.nataly { background-color: var(--aniversario); }

    /* ESTILOS VISTA DIA A DIA */
    .day-card {
      background: var(--blanco);
      border: 1.5px solid var(--beige-mediano);
      border-radius: 18px;
      overflow: hidden;
    }

    .day-card.is-today {
      border: 2px solid var(--gold-hoy);
    }

    .day-card.anniversary {
      border: 2px solid var(--aniversario);
      background: #fff8f7;
    }

    .day-header {
      background: var(--cafe-tierra);
      color: var(--blanco);
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 300;
      font-size: 0.85rem;
    }

    .shift-tag {
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 10px;
      font-weight: 300;
    }

    .day-columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .person-column {
      padding: 8px;
    }

    .person-header {
      text-align: center;
      font-size: 0.88rem;
      font-weight: 400;
      padding-bottom: 6px;
      border-bottom: 1px dashed var(--beige-mediano);
      margin-bottom: 8px;
    }

    .person-header.yeider { color: var(--cafe-oscuro); }
    .person-header.nataly { color: var(--aniversario); }

    .day-by-day-controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }

    .days-slider {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .day-pill {
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
      background: var(--blanco);
      border: 1px solid var(--beige-mediano);
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 0.8rem;
      cursor: pointer;
      white-space: nowrap;
      color: var(--cafe-oscuro);
    }

    .day-pill.active {
      background: var(--cafe-tierra);
      color: var(--blanco);
      border-color: var(--cafe-tierra);
    }

    .day-pill.is-today-pill {
      border-color: var(--gold-hoy);
      font-weight: 400;
    }

    .person-filter-bar {
      display: flex;
      justify-content: center;
      gap: 6px;
    }

    .filter-btn {
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
      background: var(--blanco);
      border: 1px solid var(--beige-mediano);
      padding: 5px 12px;
      border-radius: 10px;
      font-size: 0.78rem;
      cursor: pointer;
      color: var(--cafe-oscuro);
    }

    .filter-btn.active {
      background: var(--cafe-oscuro);
      color: var(--blanco);
    }

    .hour-slot {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 8px;
      background: var(--card-bg);
      padding: 6px;
      border-radius: 10px;
      border-left: 3px solid var(--cafe-suave);
    }

    .hour-time {
      font-size: 0.72rem;
      font-weight: 400;
      color: var(--cafe-suave);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .hour-time .sec-time {
      font-size: 0.68rem;
      font-weight: 200;
      color: var(--cafe-oscuro);
      opacity: 0.75;
    }

    .plan-item {
      background: var(--blanco);
      border: 1px solid var(--beige-mediano);
      padding: 6px 8px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--cafe-oscuro);
    }

    .plan-item.completed {
      text-decoration: line-through;
      background: #eef5ec;
      color: #388e3c;
    }

    .plan-item.failed {
      background: #fdeaea;
      color: #d32f2f;
    }

    .plan-actions { display: flex; gap: 3px; }

    .btn-icon {
      border: none;
      background: none;
      cursor: pointer;
      font-size: 0.8rem;
      padding: 2px;
    }

    .add-btn-slot {
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
      background: var(--beige-mediano);
      border: none;
      width: 100%;
      padding: 5px;
      border-radius: 6px;
      color: var(--cafe-oscuro);
      font-size: 0.72rem;
      cursor: pointer;
    }

    .add-btn-slot:hover {
      background: var(--cafe-suave);
      color: var(--blanco);
    }

    .postponed-section {
      margin-top: 22px;
      background: var(--blanco);
      border: 1.5px dashed var(--cafe-suave);
      border-radius: 16px;
      padding: 12px;
    }

    .postponed-section h3 {
      margin-top: 0;
      color: var(--cafe-tierra);
      font-size: 0.92rem;
      font-weight: 300;
    }

    .postponed-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }

    .postponed-item {
      background: var(--card-bg);
      padding: 8px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      color: var(--cafe-oscuro);
      border: 1px solid var(--beige-mediano);
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(62, 39, 35, 0.65);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 12px;
    }

    .modal-content {
      background: var(--card-bg);
      padding: 18px;
      border-radius: 18px;
      width: 100%;
      max-width: 380px;
      color: var(--cafe-oscuro);
      border: 1px solid var(--beige-mediano);
    }

    .modal-content input, .modal-content select {
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
      width: 100%;
      padding: 8px 10px;
      margin-bottom: 10px;
      border-radius: 8px;
      border: 1px solid var(--beige-mediano);
      font-size: 0.85rem;
      background: var(--blanco);
    }

    .modal-buttons { display: flex; justify-content: flex-end; gap: 8px; }
    .btn-save-modal { font-family: 'Montserrat', sans-serif; font-weight: 300; background: var(--cafe-tierra); color: white; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; }
    .btn-cancel-modal { font-family: 'Montserrat', sans-serif; font-weight: 300; background: var(--beige-mediano); color: var(--cafe-oscuro); border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; }

    @media (max-width: 600px) {
      .day-columns { grid-template-columns: 1fr; }
      .person-column { border-bottom: 1px solid var(--beige-mediano); }
      .week-row.row-3 { grid-template-columns: 1fr 1fr 1fr; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>YEIDER & NATALY ❤️</h1>
      <div class="time-zones">
        <div class="time-badge">🇧🇴 Bolivia: <span id="timeBolivia">--:--</span></div>
        <div class="time-badge">🇨🇱 Chile: <span id="timeChile">--:--</span></div>
      </div>
    </header>

    <div class="view-selector">
      <button class="btn-view" onclick="switchView('month')">📅 Mes Completo</button>
      <button class="btn-view active" onclick="switchView('week')">📆 Semanal</button>
      <button class="btn-view" onclick="switchView('day')">☀️ Día a Día</button>
      <button class="btn-view" onclick="requestNotificationPermission()" style="background:var(--cafe-tierra); color:white; border:none;">🔔 Alertas</button>
    </div>

    <div class="nav-controls">
      <button class="btn-action" onclick="changePeriod(-1)">❮ Ant.</button>
      <div id="periodTitle">Cargando...</div>
      <button class="btn-action" onclick="changePeriod(1)">Sig. ❯</button>
    </div>

    <div id="monthContainer" style="display: none;"></div>
    <div id="weekContainer" style="display: none;"></div>
    <div id="dayContainer" style="display: none;"></div>

    <div class="postponed-section">
      <h3>📌 Planes Pendientes / Aplazados</h3>
      <ul id="postponedList" class="postponed-list">
        <li style="color: var(--cafe-suave); font-size: 0.82rem;">No hay planes acumulados.</li>
      </ul>
    </div>
  </div>

  <div class="modal" id="planModal">
    <div class="modal-content">
      <h3 id="modalTitle">Nuevo Plan</h3>
      <input type="text" id="planTextInput" placeholder="Ej: Pago de arriendo, Salida a cenar...">
      
      <label style="font-size: 0.78rem; font-weight:300; color:var(--cafe-suave);">Asignar a / Para quién:</label>
      <select id="planPersonAssign">
        <option value="both">💑 Para Ambos (Yeider & Nataly)</option>
        <option value="selected">Solo para la persona actual</option>
        <option value="yeider">👦 Solo Yeider</option>
        <option value="nataly">👧 Solo Nataly</option>
      </select>

      <label style="font-size: 0.78rem; font-weight:300; color:var(--cafe-suave);">Repetición:</label>
      <select id="planRecurrence">
        <option value="none">Única vez</option>
        <option value="daily">Todos los días</option>
        <option value="weekly">Todas las semanas</option>
        <option value="monthly">Todos los meses (Ej. día 4)</option>
      </select>

      <label style="font-size: 0.78rem; font-weight:300; color:var(--cafe-suave);">Antelación de Alerta:</label>
      <select id="planAdvanceNotice">
        <option value="0">En el momento exacto</option>
        <option value="15">15 minutos antes</option>
        <option value="60">1 hora antes</option>
        <option value="1440">1 día antes</option>
        <option value="2880">2 días antes</option>
      </select>

      <div class="modal-buttons">
        <button class="btn-cancel-modal" onclick="closeModal()">Cancelar</button>
        <button class="btn-save-modal" onclick="savePlan()">Guardar 💾</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD3DxpUgdxQZ5f5VOBO_NHfhyLnn-IwWbo",
      authDomain: "calendario-875fd.firebaseapp.com",
      databaseURL: "https://calendario-875fd-default-rtdb.firebaseio.com",
      projectId: "calendario-875fd",
      storageBucket: "calendario-875fd.firebasestorage.app",
      messagingSenderId: "2826490976",
      appId: "1:2826490976:web:04cc1fb6e4a6a4f36c5f05",
      measurementId: "G-THY554NC9Z"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const plansRef = database.ref('planes_v2');
    const postponedRef = database.ref('postergados_v2');

    let currentView = 'week';
    let currentStartOfWeek = getMonday(new Date());
    let currentMonthDate = new Date();
    let selectedDayDate = new Date();
    let selectedPersonFilter = 'all';
    
    let allPlans = {};
    let allPostponed = {};
    let activeSlotInfo = null;

    const chileBaseHours = [
      "08:00", "09:00", "10:00", "11:00", "12:00", "13:00", 
      "14:00", "15:00", "16:00", "17:00", "18:00", "19:00", 
      "20:00", "21:00", "22:00", "23:00"
    ];
    const dayNames = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado", "Domingo"];

    function isToday(dateObj) {
      const today = new Date();
      return dateObj.getDate() === today.getDate() &&
             dateObj.getMonth() === today.getMonth() &&
             dateObj.getFullYear() === today.getFullYear();
    }

    function updateClocks() {
      const now = new Date();
      document.getElementById('timeChile').innerText = now.toLocaleTimeString('es-CL', { timeZone: 'America/Santiago', hour: '2-digit', minute: '2-digit' });
      document.getElementById('timeBolivia').innerText = now.toLocaleTimeString('es-BO', { timeZone: 'America/La_Paz', hour: '2-digit', minute: '2-digit' });
      checkNotifications(now);
    }
    setInterval(updateClocks, 1000);
    updateClocks();

    function requestNotificationPermission() {
      if (!("Notification" in window)) return alert("Navegador no soporta notificaciones.");
      Notification.requestPermission().then(permission => {
        if (permission === "granted") alert("¡Alertas activadas con éxito!");
      });
    }

    function checkNotifications(now) {
      if (Notification.permission !== "granted") return;
      Object.keys(allPlans).forEach(key => {
        const p = allPlans[key];
        if (p.notified || p.status !== 'pending') return;

        const dateParts = p.date.split('-');
        const hourParts = p.hour.split(':');
        const eventTime = new Date(dateParts[0], dateParts[1] - 1, dateParts[2], hourParts[0], hourParts[1]);

        const advanceMin = parseInt(p.advanceNotice || 0);
        const notifyTime = new Date(eventTime.getTime() - (advanceMin * 60 * 1000));

        if (now >= notifyTime && now < eventTime) {
          new Notification("❤️ Recordatorio Plan", {
            body: `${p.text} (${p.person.toUpperCase()}) a las ${p.hour}`,
            icon: "https://i.imgur.com/SPBevo4.png"
          });
          plansRef.child(key).update({ notified: true });
        }
      });
    }

    function getTimeDifferenceHours() {
      const now = new Date();
      const chileStr = now.toLocaleString('en-US', { timeZone: 'America/Santiago' });
      const boliviaStr = now.toLocaleString('en-US', { timeZone: 'America/La_Paz' });
      return Math.round((new Date(chileStr) - new Date(boliviaStr)) / (1000 * 60 * 60));
    }

    function formatHourOffset(baseHourStr, hourOffset) {
      const [h, m] = baseHourStr.split(':').map(Number);
      let calculatedHour = (h + hourOffset + 24) % 24;
      return `${String(calculatedHour).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
    }

    function getMonday(d) {
      d = new Date(d);
      const day = d.getDay();
      const diff = d.getDate() - day + (day === 0 ? -6 : 1);
      return new Date(d.setDate(diff));
    }

    function getYeiderShift(dateObj) {
      const baseDate = new Date(2026, 9, 6);
      const diffTime = dateObj.getTime() - baseDate.getTime();
      const diffDays = Math.floor(diffTime / (1000 * 3600 * 24));
      let cycleDay = (diffDays % 28 + 28) % 28;

      if (cycleDay >= 0 && cycleDay < 7) {
        return { text: "Turno Día ☀️", class: "shift-day" };
      } else if (cycleDay >= 7 && cycleDay < 14) {
        return { text: "Descanso 🌿", class: "shift-rest" };
      } else if (cycleDay >= 14 && cycleDay < 21) {
        return { text: "Turno Noche 🌙", class: "shift-night" };
      } else {
        return { text: "Descanso 🌿", class: "shift-rest" };
      }
    }

    plansRef.on('value', (snapshot) => {
      allPlans = snapshot.val() || {};
      renderCurrentView();
    });

    postponedRef.on('value', (snapshot) => {
      allPostponed = snapshot.val() || {};
      renderPostponed();
    });

    function switchView(view) {
      currentView = view;
      document.querySelectorAll('.btn-view').forEach(btn => btn.classList.remove('active'));
      const buttons = document.querySelectorAll('.btn-view');
      if(view === 'month') buttons[0].classList.add('active');
      if(view === 'week') buttons[1].classList.add('active');
      if(view === 'day') buttons[2].classList.add('active');
      renderCurrentView();
    }

    function changePeriod(direction) {
      if (currentView === 'month') {
        currentMonthDate.setMonth(currentMonthDate.getMonth() + direction);
      } else if (currentView === 'week') {
        currentStartOfWeek.setDate(currentStartOfWeek.getDate() + (direction * 7));
      } else if (currentView === 'day') {
        selectedDayDate.setDate(selectedDayDate.getDate() + direction);
      }
      renderCurrentView();
    }

    function renderCurrentView() {
      document.getElementById('monthContainer').style.display = 'none';
      document.getElementById('weekContainer').style.display = 'none';
      document.getElementById('dayContainer').style.display = 'none';

      if (currentView === 'month') {
        document.getElementById('monthContainer').style.display = 'grid';
        renderMonth();
      } else if (currentView === 'week') {
        document.getElementById('weekContainer').style.display = 'flex';
        renderWeek();
      } else if (currentView === 'day') {
        document.getElementById('dayContainer').style.display = 'block';
        renderDayByDay();
      }
    }

    function renderMonth() {
      const container = document.getElementById('monthContainer');
      container.className = 'month-grid';
      container.innerHTML = '';

      const year = currentMonthDate.getFullYear();
      const month = currentMonthDate.getMonth();

      document.getElementById('periodTitle').innerText = `${getMonthName(month).toUpperCase()} ${year}`;

      const headers = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
      headers.forEach(h => {
        const div = document.createElement('div');
        div.className = 'grid-header-day';
        div.innerText = h;
        container.appendChild(div);
      });

      const firstDayIndex = new Date(year, month, 1).getDay();
      const offset = firstDayIndex === 0 ? 6 : firstDayIndex - 1;
      const totalDays = new Date(year, month + 1, 0).getDate();
      const prevTotalDays = new Date(year, month, 0).getDate();

      for (let i = offset - 1; i >= 0; i--) {
        const cell = document.createElement('div');
        cell.className = 'calendar-cell other-month';
        cell.innerHTML = `<div class="cell-header"><span>${prevTotalDays - i}</span></div>`;
        container.appendChild(cell);
      }

      for (let d = 1; d <= totalDays; d++) {
        const dateObj = new Date(year, month, d);
        const dateStr = formatDate(dateObj);
        const isAnniversary = (d === 20);
        const isTodayCell = isToday(dateObj);
        const shiftInfo = getYeiderShift(dateObj);
        const dayPlans = getPlansForDate(dateStr);
        const dayOfWeek = dateObj.getDay(); 
        const isNatalyClassDay = (dayOfWeek === 2 || dayOfWeek === 4 || dayOfWeek === 6);

        const cell = document.createElement('div');
        cell.className = `calendar-cell ${isAnniversary ? 'anniversary' : ''} ${isTodayCell ? 'is-today' : ''}`;
        cell.onclick = () => { selectedDayDate = dateObj; switchView('day'); };

        let dotsHTML = '<div class="plan-dots">';
        dayPlans.forEach(p => {
          dotsHTML += `<div class="dot ${p.person}" title="${p.text}"></div>`;
        });
        dotsHTML += '</div>';

        cell.innerHTML = `
          <div class="cell-header">
            <span>${d} ${isAnniversary ? '💖' : ''}</span>
          </div>
          <span class="shift-mini-tag ${shiftInfo.class}">${shiftInfo.text}</span>
          ${isNatalyClassDay ? '<span class="class-mini-tag">Clase Nata 📚</span>' : ''}
          ${dotsHTML}
        `;
        container.appendChild(cell);
      }
    }

    /* VISTA SEMANAL REDISEÑADA A 3 FILAS (L-M, M-J, V-S-D) */
    function renderWeek() {
      const container = document.getElementById('weekContainer');
      container.className = 'week-container-3rows';
      container.innerHTML = '';

      const endOfWeek = new Date(currentStartOfWeek);
      endOfWeek.setDate(endOfWeek.getDate() + 6);

      document.getElementById('periodTitle').innerText = 
        `${currentStartOfWeek.getDate()} ${getMonthName(currentStartOfWeek.getMonth())} - ${endOfWeek.getDate()} ${getMonthName(endOfWeek.getMonth())} ${endOfWeek.getFullYear()}`;

      // Fila 1: Lunes (0) y Martes (1)
      const row1 = document.createElement('div');
      row1.className = 'week-row row-2';
      row1.appendChild(createWeekCell(0));
      row1.appendChild(createWeekCell(1));

      // Fila 2: Miércoles (2) y Jueves (3)
      const row2 = document.createElement('div');
      row2.className = 'week-row row-2';
      row2.appendChild(createWeekCell(2));
      row2.appendChild(createWeekCell(3));

      // Fila 3: Viernes (4), Sábado (5) y Domingo (6)
      const row3 = document.createElement('div');
      row3.className = 'week-row row-3';
      row3.appendChild(createWeekCell(4));
      row3.appendChild(createWeekCell(5));
      row3.appendChild(createWeekCell(6));

      container.appendChild(row1);
      container.appendChild(row2);
      container.appendChild(row3);
    }

    function createWeekCell(dayIndex) {
      const dayDate = new Date(currentStartOfWeek);
      dayDate.setDate(dayDate.getDate() + dayIndex);

      const dateStr = formatDate(dayDate);
      const dayNum = dayDate.getDate();
      const isAnniversary = (dayNum === 20);
      const isTodayCell = isToday(dayDate);
      const shiftInfo = getYeiderShift(dayDate);
      const dayPlans = getPlansForDate(dateStr);
      const dayOfWeek = dayDate.getDay();
      const isNatalyClassDay = (dayOfWeek === 2 || dayOfWeek === 4 || dayOfWeek === 6);

      const cell = document.createElement('div');
      cell.className = `calendar-cell ${isAnniversary ? 'anniversary' : ''} ${isTodayCell ? 'is-today' : ''}`;
      cell.onclick = () => { selectedDayDate = dayDate; switchView('day'); };

      let dotsHTML = '<div class="plan-dots">';
      dayPlans.forEach(p => {
        dotsHTML += `<div class="dot ${p.person}" title="${p.text}"></div>`;
      });
      dotsHTML += '</div>';

      cell.innerHTML = `
        <div class="cell-header">
          <span>${dayNames[dayIndex]} ${dayNum} ${isAnniversary ? '💖' : ''}</span>
        </div>
        <span class="shift-mini-tag ${shiftInfo.class}">${shiftInfo.text}</span>
        ${isNatalyClassDay ? '<span class="class-mini-tag">Clase Nata 📚</span>' : ''}
        ${dotsHTML}
      `;
      return cell;
    }

    function renderDayByDay() {
      const container = document.getElementById('dayContainer');
      container.innerHTML = '';

      const isTodayDay = isToday(selectedDayDate);
      document.getElementById('periodTitle').innerText = `${dayNames[(selectedDayDate.getDay() + 6) % 7]} ${selectedDayDate.getDate()} de ${getMonthName(selectedDayDate.getMonth())} ${selectedDayDate.getFullYear()} ${isTodayDay ? '⭐ HOY' : ''}`;

      const diffHours = getTimeDifferenceHours();
      const dateStr = formatDate(selectedDayDate);
      const isAnniversary = (selectedDayDate.getDate() === 20);
      const shiftInfo = getYeiderShift(selectedDayDate);
      const dayOfWeek = selectedDayDate.getDay();
      const isNatalyClassDay = (dayOfWeek === 2 || dayOfWeek === 4 || dayOfWeek === 6);

      let weekStart = getMonday(selectedDayDate);
      let sliderHTML = '<div class="days-slider">';
      for (let i = 0; i < 7; i++) {
        let d = new Date(weekStart);
        d.setDate(d.getDate() + i);
        let activeClass = formatDate(d) === dateStr ? 'active' : '';
        let todayClass = isToday(d) ? 'is-today-pill' : '';
        sliderHTML += `<div class="day-pill ${activeClass} ${todayClass}" onclick="selectDayFromSlider('${formatDate(d)}')">${dayNames[i].substring(0,3)} ${d.getDate()} ${isToday(d) ? '⭐' : ''}</div>`;
      }
      sliderHTML += '</div>';

      let filterHTML = `
        <div class="person-filter-bar">
          <button class="filter-btn ${selectedPersonFilter === 'all' ? 'active' : ''}" onclick="setPersonFilter('all')">Ambos</button>
          <button class="filter-btn ${selectedPersonFilter === 'yeider' ? 'active' : ''}" onclick="setPersonFilter('yeider')">Yeider</button>
          <button class="filter-btn ${selectedPersonFilter === 'nataly' ? 'active' : ''}" onclick="setPersonFilter('nataly')">Nataly</button>
        </div>
      `;

      let dayCard = document.createElement('div');
      dayCard.className = `day-card ${isAnniversary ? 'anniversary' : ''} ${isTodayDay ? 'is-today' : ''}`;
      
      let headerHTML = `
        <div class="day-header ${isAnniversary ? 'anniversary-header' : ''}">
          <span>${dayNames[(selectedDayDate.getDay()+6)%7]} ${selectedDayDate.getDate()} ${isAnniversary ? '💖 ANIVERSARIO 🎉' : ''} ${isTodayDay ? '⭐ (HOY)' : ''}</span>
          <div>
            <span class="shift-tag ${shiftInfo.class}">Yeider: ${shiftInfo.text}</span>
            ${isNatalyClassDay ? '<span class="shift-tag" style="background:var(--morado-clase); color:white;">Clase Nata 📚 (7pm-10pm BO)</span>' : ''}
          </div>
        </div>
      `;

      let columnsHTML = `<div class="day-columns" style="grid-template-columns: 1fr;">`;
      if (selectedPersonFilter === 'all' || selectedPersonFilter === 'yeider') {
        columnsHTML += `
          <div class="person-column">
            <div class="person-header yeider"><span>👦 YEIDER</span></div>
            ${renderHourSlots(dateStr, 'yeider', diffHours)}
          </div>
        `;
      }
      if (selectedPersonFilter === 'all' || selectedPersonFilter === 'nataly') {
        columnsHTML += `
          <div class="person-column">
            <div class="person-header nataly"><span>👧 NATALY</span></div>
            ${renderHourSlots(dateStr, 'nataly', diffHours)}
          </div>
        `;
      }
      columnsHTML += `</div>`;

      dayCard.innerHTML = headerHTML + columnsHTML;

      let controlsWrapper = document.createElement('div');
      controlsWrapper.className = 'day-by-day-controls';
      controlsWrapper.innerHTML = sliderHTML + filterHTML;

      container.appendChild(controlsWrapper);
      container.appendChild(dayCard);
    }

    function selectDayFromSlider(dateStr) {
      selectedDayDate = new Date(dateStr + 'T00:00:00');
      renderDayByDay();
    }

    function setPersonFilter(person) {
      selectedPersonFilter = person;
      renderDayByDay();
    }

    function renderHourSlots(dateStr, person, diffHours) {
      return chileBaseHours.map(chileHour => {
        let primaryTimeText = "";
        let secondaryTimeText = "";
        let slotHourKey = "";

        const boHour = formatHourOffset(chileHour, -diffHours);

        if (person === 'yeider') {
          primaryTimeText = `CL ${chileHour}`;
          secondaryTimeText = `(BO ${boHour})`;
          slotHourKey = chileHour;
        } else {
          primaryTimeText = `BO ${boHour}`;
          secondaryTimeText = `(CL ${chileHour})`;
          slotHourKey = boHour;
        }

        const plans = getPlansForSlot(dateStr, person, slotHourKey);
        
        const plansHTML = plans.map(p => `
          <div class="plan-item ${p.status || ''}">
            <span>${p.text} ${p.recurrence && p.recurrence !== 'none' ? '🔁' : ''}</span>
            <div class="plan-actions">
              <button class="btn-icon" title="Completado" onclick="setPlanStatus('${p.key}', 'completed')">✔</button>
              <button class="btn-icon" title="Incompletado" onclick="setPlanStatus('${p.key}', 'failed')">❌</button>
              <button class="btn-icon" title="Aplazar" onclick="postponePlan('${p.key}', '${p.text}')">📌</button>
              ${p.isDefaultClass ? '' : `<button class="btn-icon" title="Eliminar" onclick="deletePlan('${p.key}')">🗑️</button>`}
            </div>
          </div>
        `).join('');

        return `
          <div class="hour-slot">
            <div class="hour-time">
              <span>⏰ ${primaryTimeText}</span>
              <span class="sec-time">${secondaryTimeText}</span>
            </div>
            ${plansHTML}
            <button class="add-btn-slot" onclick="openPlanModal('${dateStr}', '${person}', '${slotHourKey}')">+ Agregar Plan</button>
          </div>
        `;
      }).join('');
    }

    function getPlansForSlot(dateStr, person, hour) {
      const result = [];
      const d = new Date(dateStr + 'T00:00:00');
      const dayOfWeek = d.getDay();

      if (person === 'nataly' && (dayOfWeek === 2 || dayOfWeek === 4 || dayOfWeek === 6)) {
        if (hour === '19:00' || hour === '20:00' || hour === '21:00') {
          result.push({
            key: `class_default_${dateStr}_${hour}`,
            text: 'Clase Nataly 📚',
            person: 'nataly',
            hour: hour,
            status: 'pending',
            isDefaultClass: true
          });
        }
      }

      Object.keys(allPlans).forEach(key => {
        const item = allPlans[key];
        if (item.person === person && item.hour === hour && matchesRecurrence(item, dateStr)) {
          result.push({ ...item, key });
        }
      });
      return result;
    }

    function getPlansForDate(dateStr) {
      const result = [];
      const d = new Date(dateStr + 'T00:00:00');
      const dayOfWeek = d.getDay();

      if (dayOfWeek === 2 || dayOfWeek === 4 || dayOfWeek === 6) {
        result.push({ person: 'nataly', text: 'Clase Nataly 📚' });
      }

      Object.keys(allPlans).forEach(key => {
        const item = allPlans[key];
        if (matchesRecurrence(item, dateStr)) {
          result.push({ ...item, key });
        }
      });
      return result;
    }

    function matchesRecurrence(item, targetDateStr) {
      if (item.date === targetDateStr) return true;
      if (!item.recurrence || item.recurrence === 'none') return false;

      const itemDate = new Date(item.date + 'T00:00:00');
      const targetDate = new Date(targetDateStr + 'T00:00:00');

      if (targetDate < itemDate) return false;

      if (item.recurrence === 'daily') {
        return true;
      } else if (item.recurrence === 'weekly') {
        const diffTime = targetDate - itemDate;
        const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
        return diffDays >= 0 && diffDays % 7 === 0;
      } else if (item.recurrence === 'monthly') {
        return targetDate.getDate() === itemDate.getDate();
      }
      return false;
    }

    function renderPostponed() {
      const list = document.getElementById('postponedList');
      list.innerHTML = '';
      const keys = Object.keys(allPostponed);

      if (keys.length === 0) {
        list.innerHTML = '<li style="color: var(--cafe-suave); font-size: 0.82rem;">No hay planes acumulados.</li>';
        return;
      }

      keys.forEach(key => {
        const item = allPostponed[key];
        const li = document.createElement('li');
        li.className = 'postponed-item';
        li.innerHTML = `
          <span>📌 ${item.text}</span>
          <button class="btn-icon" onclick="deletePostponed('${key}')">🗑️ Eliminar</button>
        `;
        list.appendChild(li);
      });
    }

    function openPlanModal(date, person, hour) {
      activeSlotInfo = { date, person, hour };
      document.getElementById('modalTitle').innerText = `Nuevo Plan (${hour})`;
      document.getElementById('planTextInput').value = '';
      document.getElementById('planPersonAssign').value = 'both';
      document.getElementById('planRecurrence').value = 'none';
      document.getElementById('planAdvanceNotice').value = '0';
      document.getElementById('planModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('planModal').style.display = 'none';
    }

    /* GUARDAR PLAN CON SINCRONIZACIÓN Y ZONA HORARIA AUTOMÁTICA */
    function savePlan() {
      const text = document.getElementById('planTextInput').value.trim();
      const assignOption = document.getElementById('planPersonAssign').value;
      const recurrence = document.getElementById('planRecurrence').value;
      const advanceNotice = document.getElementById('planAdvanceNotice').value;

      if (!text) return alert('Escribe un texto para el plan.');

      const diffHours = getTimeDifferenceHours(); // Diferencia Chile - Bolivia

      const basePlan = {
        date: activeSlotInfo.date,
        text: text,
        recurrence: recurrence,
        advanceNotice: advanceNotice,
        status: 'pending',
        notified: false
      };

      if (assignOption === 'both') {
        // Calcular hora para Yeider y Nataly ajustado a su país
        let yeiderHour = activeSlotInfo.hour;
        let natalyHour = activeSlotInfo.hour;

        if (activeSlotInfo.person === 'yeider') {
          // Creado desde Chile -> Hora Nataly en Bolivia = -diffHours
          natalyHour = formatHourOffset(yeiderHour, -diffHours);
        } else {
          // Creado desde Bolivia -> Hora Yeider en Chile = +diffHours
          yeiderHour = formatHourOffset(natalyHour, diffHours);
        }

        plansRef.push({ ...basePlan, person: 'yeider', hour: yeiderHour });
        plansRef.push({ ...basePlan, person: 'nataly', hour: natalyHour });

      } else if (assignOption === 'yeider') {
        plansRef.push({ ...basePlan, person: 'yeider', hour: activeSlotInfo.hour });
      } else if (assignOption === 'nataly') {
        plansRef.push({ ...basePlan, person: 'nataly', hour: activeSlotInfo.hour });
      } else {
        plansRef.push({ ...basePlan, person: activeSlotInfo.person, hour: activeSlotInfo.hour });
      }

      closeModal();
    }

    function setPlanStatus(key, status) {
      if (key.startsWith('class_default_')) return;
      plansRef.child(key).update({ status });
    }

    function deletePlan(key) {
      if (key.startsWith('class_default_')) return;
      plansRef.child(key).remove();
    }

    function postponePlan(key, text) {
      postponedRef.push({ text });
      if (!key.startsWith('class_default_')) {
        plansRef.child(key).remove();
      }
    }

    function deletePostponed(key) {
      postponedRef.child(key).remove();
    }

    function formatDate(d) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function getMonthName(m) {
      return ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"][m];
    }
  </script>
</body>
