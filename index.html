<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario YEIDER & NATALY ❤️</title>
  <link rel="manifest" href="./manifest.json">
<!-- Icono personalizado para la app -->
<link rel="icon" type="image/png" sizes="192x192" href="https://i.imgur.com/SPBevo4.png">
<link rel="apple-touch-icon" href="https://i.imgur.com/SPBevo4.png">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --rosado: #ff6b81;
      --rosado-hover: #ff4757;
      --plomo-oscuro: #2f3542;
      --plomo-claro: #f1f2f6;
      --plomo-medio: #747d8c;
      --blanco: #ffffff;
      --gold: #ffa502;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f8eff2;
      color: var(--plomo-oscuro);
      margin: 0;
      padding: 10px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: var(--blanco);
      border-radius: 20px;
      padding: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

    header {
      text-align: center;
      border-bottom: 2px solid var(--plomo-claro);
      padding-bottom: 15px;
      margin-bottom: 15px;
    }

    header h1 {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: 2.2rem;
      letter-spacing: -0.5px;
      color: var(--rosado);
      margin: 0;
      text-transform: uppercase;
    }

    /* Clocks Header */
    .time-zones {
      display: flex;
      justify-content: center;
      gap: 15px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--plomo-medio);
      margin-top: 8px;
      flex-wrap: wrap;
    }
    .time-badge {
      background: var(--plomo-claro);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid #dfe4ea;
    }

    /* Navigation Controls */
    .nav-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .btn-action {
      background: var(--rosado);
      color: var(--blanco);
      border: none;
      padding: 10px 18px;
      border-radius: 25px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(255, 107, 129, 0.3);
      transition: all 0.2s ease;
    }

    .btn-action:hover {
      background: var(--rosado-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(255, 107, 129, 0.4);
    }

    .btn-action:active {
      transform: translateY(0);
    }

    #weekTitle {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--plomo-oscuro);
      text-align: center;
    }

    /* Days List (Weekly Layout) */
    .week-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .day-card {
      background: var(--blanco);
      border: 2px solid var(--plomo-claro);
      border-radius: 16px;
      overflow: hidden;
      transition: border-color 0.3s;
    }

    .day-card.anniversary {
      border: 2px solid var(--gold);
      background: #fffdf5;
      animation: pulseAnniversary 2s infinite alternate;
    }

    @keyframes pulseAnniversary {
      0% { box-shadow: 0 0 5px rgba(255, 165, 2, 0.3); }
      100% { box-shadow: 0 0 18px rgba(255, 165, 2, 0.7); }
    }

    .day-header {
      background: var(--plomo-oscuro);
      color: var(--blanco);
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
    }

    .day-header.anniversary-header {
      background: linear-gradient(45deg, #ffa502, #ff6b81);
    }

    .shift-tag {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 10px;
      font-weight: 600;
    }
    .shift-day { background: #eccc68; color: #2f3542; }
    .shift-night { background: #3742fa; color: #ffffff; }
    .shift-rest { background: #2ed573; color: #ffffff; }

    .day-columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      divide-x: 2px solid var(--plomo-claro);
    }

    .person-column {
      padding: 10px;
    }

    .person-header {
      text-align: center;
      font-size: 0.95rem;
      font-weight: 700;
      padding-bottom: 8px;
      border-bottom: 2px dashed var(--plomo-claro);
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .person-header.yeider { color: var(--plomo-oscuro); }
    .person-header.nataly { color: var(--rosado); }

    /* Hourly slot */
    .hour-slot {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 8px;
      background: #fafafa;
      padding: 6px 8px;
      border-radius: 8px;
      border-left: 3px solid var(--plomo-medio);
    }

    .hour-time {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--plomo-medio);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hour-time .sec-time {
      font-size: 0.7rem;
      font-weight: 500;
      color: #a4b0be;
    }

    .plan-item {
      background: var(--blanco);
      border: 1px solid #e0e0e0;
      padding: 6px 8px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .plan-item.completed {
      text-decoration: line-through;
      background: #e8f8f5;
      color: #27ae60;
      border-color: #27ae60;
    }

    .plan-item.failed {
      background: #fadbd8;
      color: #c0392b;
      border-color: #c0392b;
    }

    .plan-actions {
      display: flex;
      gap: 4px;
    }

    .btn-icon {
      border: none;
      background: none;
      cursor: pointer;
      font-size: 0.85rem;
      padding: 2px 4px;
      border-radius: 4px;
      transition: transform 0.1s;
    }

    .btn-icon:hover { transform: scale(1.2); }

    .add-btn-slot {
      background: var(--plomo-claro);
      border: none;
      width: 100%;
      padding: 4px;
      border-radius: 6px;
      color: var(--plomo-oscuro);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
      transition: background 0.2s;
    }

    .add-btn-slot:hover { background: #dfe4ea; }

    /* Postponed Section */
    .postponed-section {
      margin-top: 30px;
      background: #fff8f9;
      border: 2px dashed var(--rosado);
      border-radius: 16px;
      padding: 15px;
    }

    .postponed-section h3 {
      margin-top: 0;
      color: var(--rosado);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .postponed-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .postponed-item {
      background: var(--blanco);
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #f1f2f6;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.88rem;
      box-shadow: 0 2px 5px rgba(0,0,0,0.03);
    }

    /* Modal Form */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 10px;
    }

    .modal-content {
      background: var(--blanco);
      padding: 20px;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    .modal-content h3 { margin-top: 0; color: var(--plomo-oscuro); }

    .modal-content input {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 0.9rem;
    }

    .modal-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .btn-save-modal { background: var(--rosado); color: white; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; }
    .btn-cancel-modal { background: var(--plomo-claro); color: var(--plomo-oscuro); border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; }

    @media (max-width: 600px) {
      .day-columns { grid-template-columns: 1fr; }
      .person-column { border-bottom: 2px solid var(--plomo-claro); }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>YEIDER & NATALY ❤️</h1>
      <div class="time-zones">
        <div class="time-badge">🇧🇴 Bolivia: <span id="timeBolivia">--:--</span></div>
        <div class="time-badge">🇨🇱 Chile: <span id="timeChile">--:--</span></div>
      </div>
    </header>

    <div class="nav-controls">
      <button class="btn-action" onclick="changeWeek(-1)">❮ Sem. Anterior</button>
      <div id="weekTitle">Cargando semana...</div>
      <button class="btn-action" onclick="changeWeek(1)">Sem. Siguiente ❯</button>
    </div>

    <!-- Contenedor Semanal Dinámico -->
    <div id="weekContainer" class="week-container"></div>

    <!-- Sección de Planes Postergados -->
    <div class="postponed-section">
      <h3>📌 Planes Pendientes / Aplazados (Sin Fecha)</h3>
      <ul id="postponedList" class="postponed-list">
        <li style="color: var(--plomo-medio); font-size: 0.85rem;">No hay planes pendientes acumulados.</li>
      </ul>
    </div>
  </div>

  <!-- Modal para Agregar Plan -->
  <div class="modal" id="planModal">
    <div class="modal-content">
      <h3 id="modalTitle">Nuevo Plan</h3>
      <input type="text" id="planTextInput" placeholder="Ej: Salida a cenar, Videollamada...">
      
      <div class="modal-buttons">
        <button class="btn-cancel-modal" onclick="closeModal()">Cancelar</button>
        <button class="btn-save-modal" onclick="savePlan()">Guardar Plan 💾</button>
      </div>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD3DxpUgdxQZ5f5VOBO_NHfhyLnn-IwWbo",
      authDomain: "calendario-875fd.firebaseapp.com",
      databaseURL: "https://calendario-875fd-default-rtdb.firebaseio.com",
      projectId: "calendario-875fd",
      storageBucket: "calendario-875fd.firebasestorage.app",
      messagingSenderId: "2826490976",
      appId: "1:2826490976:web:04cc1fb6e4a6a4f36c5f05",
      measurementId: "G-THY554NC9Z"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const plansRef = database.ref('planes_v2');
    const postponedRef = database.ref('postergados_v2');

    let currentStartOfWeek = getMonday(new Date());
    let allPlans = {};
    let allPostponed = {};
    let activeSlotInfo = null;

    // Horas base de Chile
    const chileBaseHours = [
      "08:00", "09:00", "10:00", "11:00", "12:00", "13:00", 
      "14:00", "15:00", "16:00", "17:00", "18:00", "19:00", 
      "20:00", "21:00", "22:00", "23:00"
    ];
    const dayNames = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado", "Domingo"];

    // Actualizador de Relojes superiores
    function updateClocks() {
      const now = new Date();
      document.getElementById('timeChile').innerText = now.toLocaleTimeString('es-CL', { timeZone: 'America/Santiago', hour: '2-digit', minute: '2-digit' });
      document.getElementById('timeBolivia').innerText = now.toLocaleTimeString('es-BO', { timeZone: 'America/La_Paz', hour: '2-digit', minute: '2-digit' });
    }
    setInterval(updateClocks, 1000);
    updateClocks();

    // Obtener diferencia horaria entre Chile y Bolivia
    function getTimeDifferenceHours() {
      const now = new Date();
      const chileStr = now.toLocaleString('en-US', { timeZone: 'America/Santiago' });
      const boliviaStr = now.toLocaleString('en-US', { timeZone: 'America/La_Paz' });
      const chileDate = new Date(chileStr);
      const boliviaDate = new Date(boliviaStr);
      return Math.round((chileDate - boliviaDate) / (1000 * 60 * 60));
    }

    function formatHourOffset(baseHourStr, hourOffset) {
      const [h, m] = baseHourStr.split(':').map(Number);
      let calculatedHour = (h + hourOffset + 24) % 24;
      return `${String(calculatedHour).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
    }

    function getMonday(d) {
      d = new Date(d);
      const day = d.getDay();
      const diff = d.getDate() - day + (day === 0 ? -6 : 1);
      return new Date(d.setDate(diff));
    }

    // Calculador de Turno 7x7 Yeider
    function getYeiderShift(dateObj) {
      const baseDate = new Date(2026, 9, 6);
      const diffTime = dateObj.getTime() - baseDate.getTime();
      const diffDays = Math.floor(diffTime / (1000 * 3600 * 24));
      
      let cycleDay = (diffDays % 28 + 28) % 28;

      if (cycleDay >= 0 && cycleDay < 7) {
        return { text: "Turno Día ☀️", class: "shift-day" };
      } else if (cycleDay >= 7 && cycleDay < 14) {
        return { text: "Descanso 🌿", class: "shift-rest" };
      } else if (cycleDay >= 14 && cycleDay < 21) {
        return { text: "Turno Noche 🌙", class: "shift-night" };
      } else {
        return { text: "Descanso 🌿", class: "shift-rest" };
      }
    }

    plansRef.on('value', (snapshot) => {
      allPlans = snapshot.val() || {};
      renderWeek();
    });

    postponedRef.on('value', (snapshot) => {
      allPostponed = snapshot.val() || {};
      renderPostponed();
    });

    function changeWeek(direction) {
      currentStartOfWeek.setDate(currentStartOfWeek.getDate() + (direction * 7));
      renderWeek();
    }

    function renderWeek() {
      const container = document.getElementById('weekContainer');
      container.innerHTML = '';

      const endOfWeek = new Date(currentStartOfWeek);
      endOfWeek.setDate(endOfWeek.getDate() + 6);

      document.getElementById('weekTitle').innerText = 
        `${currentStartOfWeek.getDate()} ${getMonthName(currentStartOfWeek.getMonth())} - ${endOfWeek.getDate()} ${getMonthName(endOfWeek.getMonth())} ${endOfWeek.getFullYear()}`;

      const diffHours = getTimeDifferenceHours(); // Diferencia Chile - Bolivia

      for (let i = 0; i < 7; i++) {
        const dayDate = new Date(currentStartOfWeek);
        dayDate.setDate(dayDate.getDate() + i);

        const dateStr = formatDate(dayDate);
        const dayNum = dayDate.getDate();
        const isAnniversary = (dayNum === 20);
        const shiftInfo = getYeiderShift(dayDate);

        const dayCard = document.createElement('div');
        dayCard.className = `day-card ${isAnniversary ? 'anniversary' : ''}`;

        let headerHTML = `
          <div class="day-header ${isAnniversary ? 'anniversary-header' : ''}">
            <span>${dayNames[i]} ${dayNum} de ${getMonthName(dayDate.getMonth())} ${isAnniversary ? '💖 ¡NUESTRO ANIVERSARIO! 🎉' : ''}</span>
            <span class="shift-tag ${shiftInfo.class}">Yeider: ${shiftInfo.text}</span>
          </div>
        `;

        let columnsHTML = `
          <div class="day-columns">
            <!-- Columna Yeider: Hora Chile principal (08:00), Hora Bolivia secundaria (07:00) -->
            <div class="person-column">
              <div class="person-header yeider">
                <span>👦 YEIDER</span>
              </div>
              ${renderHourSlots(dateStr, 'yeider', diffHours)}
            </div>

            <!-- Columna Nataly: Hora Bolivia principal (07:00), Hora Chile secundaria (08:00) -->
            <div class="person-column">
              <div class="person-header nataly">
                <span>👧 NATALY</span>
              </div>
              ${renderHourSlots(dateStr, 'nataly', diffHours)}
            </div>
          </div>
        `;

        dayCard.innerHTML = headerHTML + columnsHTML;
        container.appendChild(dayCard);
      }
    }

    function renderHourSlots(dateStr, person, diffHours) {
      return chileBaseHours.map(chileHour => {
        let primaryTimeText = "";
        let secondaryTimeText = "";
        let slotHourKey = "";

        // Hora equivalente de Bolivia para esa misma fila
        const boHour = formatHourOffset(chileHour, -diffHours);

        if (person === 'yeider') {
          // Yeider: Principal = Chile 08:00 | Secundaria = Bolivia 07:00
          primaryTimeText = `CL ${chileHour}`;
          secondaryTimeText = `(BO ${boHour})`;
          slotHourKey = chileHour;
        } else {
          // Nataly: Principal = Bolivia 07:00 | Secundaria = Chile 08:00
          primaryTimeText = `BO ${boHour}`;
          secondaryTimeText = `(CL ${chileHour})`;
          slotHourKey = boHour;
        }

        const plans = getPlansForSlot(dateStr, person, slotHourKey);
        
        const plansHTML = plans.map(p => `
          <div class="plan-item ${p.status || ''}">
            <span>${p.text}</span>
            <div class="plan-actions">
              <button class="btn-icon" title="Completado" onclick="setPlanStatus('${p.key}', 'completed')">✔</button>
              <button class="btn-icon" title="Incompletado (F)" onclick="setPlanStatus('${p.key}', 'failed')">❌</button>
              <button class="btn-icon" title="Aplazar a lista sin fecha" onclick="postponePlan('${p.key}', '${p.text}')">📌</button>
              <button class="btn-icon" title="Eliminar" onclick="deletePlan('${p.key}')">🗑️</button>
            </div>
          </div>
        `).join('');

        return `
          <div class="hour-slot">
            <div class="hour-time">
              <span>⏰ ${primaryTimeText}</span>
              <span class="sec-time">${secondaryTimeText}</span>
            </div>
            ${plansHTML}
            <button class="add-btn-slot" onclick="openPlanModal('${dateStr}', '${person}', '${slotHourKey}')">+ Agregar Plan</button>
          </div>
        `;
      }).join('');
    }

    function getPlansForSlot(dateStr, person, hour) {
      const result = [];
      Object.keys(allPlans).forEach(key => {
        const item = allPlans[key];
        if (item.date === dateStr && item.person === person && item.hour === hour) {
          result.push({ ...item, key });
        }
      });
      return result;
    }

    function renderPostponed() {
      const list = document.getElementById('postponedList');
      list.innerHTML = '';
      const keys = Object.keys(allPostponed);

      if (keys.length === 0) {
        list.innerHTML = '<li style="color: var(--plomo-medio); font-size: 0.85rem;">No hay planes pendientes acumulados.</li>';
        return;
      }

      keys.forEach(key => {
        const item = allPostponed[key];
        const li = document.createElement('li');
        li.className = 'postponed-item';
        li.innerHTML = `
          <span>📌 ${item.text}</span>
          <button class="btn-icon" onclick="deletePostponed('${key}')">🗑️ Eliminar</button>
        `;
        list.appendChild(li);
      });
    }

    function openPlanModal(date, person, hour) {
      activeSlotInfo = { date, person, hour };
      document.getElementById('modalTitle').innerText = `Plan para ${person.toUpperCase()} (${hour})`;
      document.getElementById('planTextInput').value = '';
      document.getElementById('planModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('planModal').style.display = 'none';
    }

    function savePlan() {
      const text = document.getElementById('planTextInput').value.trim();
      if (!text) return alert('Escribe un texto para el plan.');

      plansRef.push({
        date: activeSlotInfo.date,
        person: activeSlotInfo.person,
        hour: activeSlotInfo.hour,
        text: text,
        status: 'pending'
      });

      closeModal();
    }

    function setPlanStatus(key, status) {
      plansRef.child(key).update({ status });
    }

    function deletePlan(key) {
      plansRef.child(key).remove();
    }

    function postponePlan(key, text) {
      postponedRef.push({ text });
      plansRef.child(key).remove();
    }

    function deletePostponed(key) {
      postponedRef.child(key).remove();
    }

    function formatDate(d) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function getMonthName(m) {
      return ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"][m];
    }
  </script>
</body>
</html>
